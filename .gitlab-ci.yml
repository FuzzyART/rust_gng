stages:
  - build
  - test
  - package

build:
  stage: build
  image: python:3.12-slim
  cache:
    key: rust-and-pip
    paths:
      - .cargo/
      - .rustup/
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl build-essential libssl-dev pkg-config git
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustup default stable
    - pip install --quiet maturin
  script:
    - cd gng
    - maturin build --release -o ../dist
    - ls -lh ../dist/
  artifacts:
    paths:
      - dist/*.whl
    expire_in: 1 week

test:
  stage: test
  image: python:3.12-slim
  script:
    - pip install numpy pandas
    - pip install dist/*.whl
    - python -c "import gng; print('Import OK!')"
  dependencies:
    - build

package:
  stage: package
  image: python:3.12-slim
  script:
    - echo "Packaging wheel for release"
    - ls -lh dist/*.whl
    - sha256sum dist/*.whl
  artifacts:
    paths:
      - dist/*.whl
    name: "gng-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
  only:
    - tags
    - main
    - dev
  dependencies:
    - build
