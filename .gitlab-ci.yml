image: ghcr.io/pyo3/maturin:master-py3.12-slim

stages:
  - build
  - test
  - package

build:
  stage: build
  script:
    - cd gng_py
    - maturin build --release -o ../dist
    - ls -lh ../dist/
  artifacts:
    paths:
      - "dist/*.whl"
    expire_in: 1 week

test:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install numpy pandas
  script:
    - pip install dist/*.whl
    - python3 -c "import gng_py; print('Import OK!')"
  dependencies:
    - build

package:
  stage: package
  script:
    - echo "Packaging wheel for release"
    - ls -lh dist/*.whl
    - sha256sum dist/*.whl
  artifacts:
    paths:
      - "dist/*.whl"
    name: "gng_py-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
  only:
    - tags
    - main

