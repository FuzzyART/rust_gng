stages:
  - build
  - test
  - package

variables:
  # Optional: Cache Rust/cargo and pip for faster rebuilds
  CACHE_RUST: ${CI_JOB_NAME}-rust
  CACHE_PIP: ${CI_JOB_NAME}-pip

build:
  stage: build
  image: python:3.12-slim
  before_script:
    # Install system deps for Rust compilation
    - apt-get update -qq && apt-get install -y -qq curl pkg-config libssl-dev build-essential git
    # Install Rust (stable toolchain)
    - curl https://sh.rustup.rs -sSf | sh -s -- -y
    - source $HOME/.cargo/env
    # Cache Rust if enabled
    - |
      if [ -n "$CACHE_RUST" ]; then
        export CARGO_HOME="$CI_PROJECT_DIR/.cargo"
        export RUSTUP_HOME="$CI_PROJECT_DIR/.rustup"
        mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
        source $HOME/.cargo/env
      fi
    # Install maturin via pip
    - pip install -qq maturin
    # Cache pip if enabled
    - pip install -qq --cache-dir .pip-cache maturin
  cache:
    key: ${CACHE_RUST}
    paths:
      - .cargo/
      - .rustup/
    policy: pull-push
  script:
    - cd gng_py
    - maturin build --release -o ../dist
    - ls -lh ../dist/
  artifacts:
    paths:
      - "dist/*.whl"
    expire_in: 1 week
  cache:
    key: ${CACHE_PIP}
    paths:
      - .pip-cache/
    policy: pull-push

test:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install numpy pandas
  script:
    - pip install dist/*.whl
    - python3 -c "import gng_py; print('Import OK!')"
  dependencies:
    - build

package:
  stage: package
  image: python:3.12-slim
  script:
    - echo "Packaging wheel for release"
    - ls -lh dist/*.whl
    - sha256sum dist/*.whl
  artifacts:
    paths:
      - "dist/*.whl"
    name: "gng_py-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
  only:
    - tags
    - main
  dependencies:
    - build
